# Schema migrations. The server applies them itself at start-up (app.database.init_db), so you only
# need this file to create a new migration:  cd AquaSentry_Platform && alembic revision -m "what changed"
# The database comes from DATABASE_URL (or the default aquasentry.db next to this file).
[alembic]
script_location = app/migrations
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
