<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="AquaSentry Water Quality Surveillance Logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AquaSentry Logo</title>
  <desc>Water droplet centered inside fine concentric detection ripple arcs</desc>
  <!-- Outer incomplete ripple arc -->
  <path d="M 5 21 A 13 13 0 1 1 27 21" stroke="#087E8B" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.4"/>
  <!-- Inner incomplete ripple arc -->
  <path d="M 8.5 21 A 9.5 9.5 0 1 1 23.5 21" stroke="#087E8B" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.75"/>
  <!-- Scanning detection node -->
  <circle cx="23.5" cy="8.5" r="1.5" fill="#18AEB0"/>
  <!-- Central rounded water droplet -->
  <path d="M 16 7 C 16 7 11.5 13.5 11.5 17.5 A 4.5 4.5 0 0 0 20.5 17.5 C 20.5 13.5 16 7 16 7 Z" fill="#087E8B"/>
  <!-- Horizontal waterline base -->
  <path d="M 10 24.5 L 22 24.5" stroke="#087E8B" stroke-width="2" stroke-linecap="round"/>
</svg>
