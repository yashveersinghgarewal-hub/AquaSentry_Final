name: AquaSentry Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc g++

      - name: Set up Node (dashboard JS checks + browser-engine parity test)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check every dashboard script
        run: |
          for f in AquaSentry_Platform/frontend/*.js; do node --check "$f"; done

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff, bug-finding rules in ruff.toml)
        run: |
          pip install ruff
          ruff check .

      - name: Compile C99 Embedded Neural Engine
        run: |
          clang -std=c99 -Wall -Wextra -Werror -c Neural_Network/aquanet_v1.c -o /tmp/aquanet_v1.o

      - name: Compile ESP32 AquaNet-V3 engine (float32, no malloc)
        run: |
          clang -std=c99 -Wall -Wextra -Werror -c Firmware/esp32_firmware/aquanet_v3.c -I Firmware/esp32_firmware -o /tmp/aquanet_v3.o
          clang -std=c99 -Wall -Wextra -Werror -c Firmware/esp32_firmware/aquanet_v1.c -I Firmware/esp32_firmware -o /tmp/fw_aquanet_v1.o

      - name: Run neural toolkit + platform tests (incl. Python / JS / C rule parity)
        run: |
          python main.py --test

      - name: Platform tests in single-connection mode (SQLite without the WAL-reset fix)
        if: matrix.python-version == '3.12'
        working-directory: AquaSentry_Platform
        env:
          SQLITE_SINGLE_CONNECTION: "1"
        run: python -m pytest -q tests

  browser:
    # The pages themselves: console errors, CSP violations, phone-width layout, map, languages, QR page,
    # lazy loading, a WCAG 2.2 AA audit (axe-core) and Lighthouse scores.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          npm install --no-save axe-core@4.10.3
      - name: Browser tests
        working-directory: AquaSentry_Platform
        env:
          AXE_PATH: ${{ github.workspace }}/node_modules/axe-core/axe.min.js
        run: python -m pytest -q tests_e2e
      - name: Lighthouse (advisory; the axe audit above is the accessibility gate)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cp AquaSentry_Platform/aquasentry.db /tmp/lh.db
          (cd AquaSentry_Platform && DATABASE_URL=sqlite:////tmp/lh.db python -m uvicorn app.main:app --port 8077 &)
          sleep 6
          for u in "index.html" "device.html?code=DEMO-BOT-01"; do
            npx --yes lighthouse@12.2.1 "http://127.0.0.1:8077/$u" --quiet --preset=desktop --max-wait-for-load=30000 \
              --output=json --output-path=/tmp/lh.json --chrome-flags="--headless=new --no-sandbox"
            python -c "import json,sys; c=json.load(open('/tmp/lh.json'))['categories']; s={k: round(v['score']*100) for k, v in c.items()}; print(sys.argv[1], s); sys.exit(0 if s['accessibility'] >= 95 else 1)" "$u"
          done

  firmware:
    # Real compile of the ESP32 sketch with Espressif's Arduino core, for every supported chip.
    runs-on: ubuntu-24.04   # arduino/compile-sketches pins Python 3.12.4, which has no build for Ubuntu 26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: esp32:esp32:esp32        # ESP32-WROOM-32 DevKit (default pins)
            flags: ""
          - fqbn: esp32:esp32:esp32s3      # ESP32-S3
            flags: ""
          - fqbn: esp32:esp32:esp32c3      # ESP32-C3 (single core)
            flags: ""
          # the optional features (deep sleep, battery monitor, unchecked TLS path) on two chip families
          - fqbn: esp32:esp32:esp32
            flags: "-DLOW_POWER_MODE=1 -DPIN_BATTERY_ADC=35 -DALLOW_INSECURE_TLS=1"
          - fqbn: esp32:esp32:esp32c3
            flags: "-DLOW_POWER_MODE=1 -DPIN_BATTERY_ADC=0 -DALLOW_INSECURE_TLS=1"
          # v5.6: total arsenic (reagent pump), all water-quality sensors and server-pulled updates
          - fqbn: esp32:esp32:esp32
            flags: "-DPULL_OTA=1 -DPIN_REAGENT_PUMP=13 -DPIN_TEMP_NTC=32 -DPIN_PH_ADC=36 -DPIN_EC_ADC=39 -DPIN_TURBIDITY_ADC=33"
          - fqbn: esp32:esp32:esp32s3
            flags: "-DPULL_OTA=1 -DPIN_REAGENT_PUMP=15 -DPIN_TEMP_NTC=10 -DPIN_PH_ADC=1"
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (the ESP32 toolchains are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Compile esp32_firmware.ino
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          sketch-paths: |
            - Firmware/esp32_firmware
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          enable-warnings-report: true
          cli-compile-flags: |
            - --warnings
            - default
            - --build-property
            - compiler.cpp.extra_flags=${{ matrix.flags }}
