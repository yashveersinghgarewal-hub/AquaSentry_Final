name: AquaSentry Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc g++

      - name: Set up Node (dashboard JS checks + browser-engine parity test)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check every dashboard script
        run: |
          for f in AquaSentry_Platform/frontend/*.js; do node --check "$f"; done

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile C99 Embedded Neural Engine
        run: |
          clang -std=c99 -Wall -Wextra -Werror -c Neural_Network/aquanet_v1.c -o /tmp/aquanet_v1.o

      - name: Compile ESP32 AquaNet-V3 engine (float32, no malloc)
        run: |
          clang -std=c99 -Wall -Wextra -Werror -c Firmware/esp32_firmware/aquanet_v3.c -I Firmware/esp32_firmware -o /tmp/aquanet_v3.o
          clang -std=c99 -Wall -Wextra -Werror -c Firmware/esp32_firmware/aquanet_v1.c -I Firmware/esp32_firmware -o /tmp/fw_aquanet_v1.o

      - name: Run neural toolkit + platform tests (incl. Python / JS / C rule parity)
        run: |
          python main.py --test

  firmware:
    # Real compile of the ESP32 sketch with Espressif's Arduino core, for every supported chip.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - esp32:esp32:esp32        # ESP32-WROOM-32 DevKit (default pins)
          - esp32:esp32:esp32s3      # ESP32-S3
          - esp32:esp32:esp32c3      # ESP32-C3 (single core)
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the ESP32 toolchains are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Compile esp32_firmware.ino
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          sketch-paths: |
            - Firmware/esp32_firmware
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          enable-warnings-report: true
          cli-compile-flags: |
            - --warnings
            - default
