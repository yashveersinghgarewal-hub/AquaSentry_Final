; PlatformIO build for the AquaSentry node (alternative to the Arduino IDE).
; Open the Firmware/ folder in VS Code with the PlatformIO extension, pick an environment, Upload.
; The sketch itself lives in esp32_firmware/ so the Arduino IDE can open it too.

[platformio]
src_dir = esp32_firmware
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -Wall

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1

; ESP32-C6 needs Espressif's Arduino core 3.x; with the community "pioarduino" platform:
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
[env:esp32-c6]
board = esp32-c6-devkitc-1

; Battery-powered node: deep sleep between tests and a battery divider on GPIO35 (see README).
[env:esp32dev-lowpower]
board = esp32dev
build_flags = ${env.build_flags} -DLOW_POWER_MODE=1 -DPIN_BATTERY_ADC=35

; Full field node: total arsenic (reagent pump on GPIO13), NTC temperature (32), pH (36), conductivity (39)
; and turbidity (33) on free ADC1 pins, and firmware updates pulled from the server (see README).
[env:esp32dev-field]
board = esp32dev
build_flags = ${env.build_flags} -DPIN_REAGENT_PUMP=13 -DPIN_TEMP_NTC=32 -DPIN_PH_ADC=36 -DPIN_EC_ADC=39 -DPIN_TURBIDITY_ADC=33 -DPULL_OTA=1
