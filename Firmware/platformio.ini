; PlatformIO build for the AquaSentry node (alternative to the Arduino IDE).
; Open the Firmware/ folder in VS Code with the PlatformIO extension, pick an environment, Upload.
; The sketch itself lives in esp32_firmware/ so the Arduino IDE can open it too.

[platformio]
src_dir = esp32_firmware
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -Wall

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1

; Battery-powered node: deep sleep between tests and a battery divider on GPIO35 (see README).
[env:esp32dev-lowpower]
board = esp32dev
build_flags = ${env.build_flags} -DLOW_POWER_MODE=1 -DPIN_BATTERY_ADC=35
